<!DOCTYPE html>
<html lang="fr" class="">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CustomDirecte</title>
  <!-- CSS -->
  <style>
    /* CSS Reset - Prevents Chrome injecting its own styles */
    html,
    body {
      all: unset;
    }
  </style>
  <link rel="stylesheet" href="interface.css" />
  <!-- Scripts -->
  <script type="text/javascript" src="../../scripts/browser.js"></script>
  <script type="text/javascript" src="../../scripts/log.js"></script>
  <script type="text/javascript" src="../../scripts/settings.js"></script>
  <script type="text/javascript" src="../../scripts/parameters.js"></script>
  <script type="text/javascript" src="interface.js"></script>
  <script src="../../scripts/tippy.js"></script>
</head>

<body id="body" data-tab="home" class="flex flex-col w-full h-full group/body bg-custom-gray">

  <div class="tippyParent" style="position: fixed;top: 0;left: 0;width: 100%;height: 100%;pointer-events: none;transform: scale(calc(1 / var(--zoom)));transform-origin: top left;"></div>

  <!--  █ █ █▀▀ ▄▀█ █▀▄ █▀▀ █▀█  -->
  <!--  █▀█ ██▄ █▀█ █▄▀ ██▄ █▀▄  -->

  <header class="h-[54px] flex items-center px-5 shadow-sm bg-custom-white-light">
    <!-- Titre -->
    <h1 id="title" class="flex-none text-[22px] font-semibold !text-text cursor-pointer">CustomDirecte</h1>
    <!-- Sperateur -->
    <div class="flex-none ml-[22px] h-[54px] w-px bg-custom-gray-verydark-transp shadow-md"></div>
    <!-- Navbar -->
    <nav class="flex-1">
      <ul class="flex items-center gap-4 pl-4" id="navbar">

      </ul>
    </nav>
    <!-- Sperateur -->
    <div class="flex-none ml-[22px] h-[54px] w-px bg-custom-gray-verydark-transp shadow-md"></div>
    <!-- Vertion -->
    <div class="rounded-[5px] ml-[22px] flex bg-custom-pink-transp p-1.5">
      <p id="version" class="rounded-[10px] text-[14px] flex items-center justify-center bg-custom-pink px-1.5 font-medium text-text-white-full">V3 | Erreur</p>
    </div>
    <!-- Sperateur -->
    <div class="flex-none ml-[22px] h-[54px] w-px bg-custom-gray-verydark-transp shadow-md"></div>
    <!-- Return Button -->
    <button id="returnButton" data-needreload="false" class="group/return transition-all duration-150 ease-in-out group/backbutton cursor-pointer ml-[22px] px-2 py-1 hover:bg-custom-pink-transp active:bg-custom-pink flex-none rounded-lg focus:outline-none focus:ring-4 focus:ring-custom-pink-transp border border-solid border-custom-gray-verydark-transp shadow-xl gap-[9px] flex items-center">
      <svg class="h-[12px] filter-white transition-all duration-75 hidden group-data-[needreload=false]/return:block" width="14" height="13" viewBox="0 0 14 13" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3.1875 7.5L7.26039 11.5729C7.58747 11.9 7.58512 12.431 7.25516 12.7552C6.92931 13.0753 6.40632 13.073 6.08331 12.75L0.707106 7.37377C0.316582 6.98325 0.316582 6.35008 0.707107 5.95956L6.08331 0.583355C6.40632 0.260345 6.92931 0.258032 7.25516 0.578171C7.58512 0.902342 7.58747 1.43336 7.26039 1.76044L3.1875 5.83333H12.5C12.9602 5.83333 13.3333 6.20643 13.3333 6.66667C13.3333 7.1269 12.9602 7.5 12.5 7.5H3.1875Z" fill="#C8194A" />
      </svg>
      <img src="./svg/icons/needreload.svg" class="h-[12px] filter-mainColor transition-all duration-75 hidden group-data-[needreload=true]/return:block">
      <p class="text-[18px] font-medium text-text group-active/backbutton:text-text-white-full hidden group-data-[needreload=false]/return:block">Retour</p>
      <p class="text-[18px] font-medium text-text group-active/backbutton:text-text-white-full hidden group-data-[needreload=true]/return:block">Actualiser</p>
    </button>
  </header>

  <!--  █ █ █▀█ █▀▄▀█ █▀▀ -->
  <!--  █▀█ █▄█ █ ▀ █ ██▄ -->

  <main class="hidden group-data-[tab=home]/body:flex mx-[38px] my-6 flex-col flex-nowrap gap-6" id="main">

  </main>

  <footer class="hidden group-data-[tab=home]/body:flex mx-[38px] flex-row flex-1 gap-6">

    <!-- Left Side -->
    <div class="rounded-[18px] h-fit flex flex-1 border border-solid border-custom-gray-verydark-transp bg-custom-white p-6 shadow-lg">
      <div class="flex w-full gap-5">

        <!-- Texte -->
        <div class="flex flex-col flex-1 ml-4">
          <h2 class="text-[22px] font-semibold text-text">
            Notez notre extension
          </h2>
          <!-- <div class="flex flex-row gap-4">
            <embed src="../stars/ChromeWebStars.html" type="text/html" width="159" height="30">
          </div> -->
        </div>

        <!-- Button : "Notez" -->
        <div id="starsButton" class="flex items-end">
          <button class="transition-all duration-150 ease-in-out group/button cursor-pointer ml-[22px] px-2 py-1 bg-custom-gray-verydark hover:bg-custom-gray-dark active:bg-custom-pink flex-none rounded-lg focus:outline-none focus:ring-4 focus:ring-custom-gray-dark-transp border border-solid border-custom-gray-verydark-transp shadow-xl gap-[9px] flex items-center">
            <p class="transition-all duration-150 ease-in-out text-[18px] font-medium text-text-white group-active/button:text-text">
              Notez
            </p>
          </button>
        </div>
      </div>
    </div>

    <!-- Right Side -->
    <div class="rounded-[18px] h-fit flex flex-1 border border-solid border-custom-gray-verydark-transp bg-custom-white p-6 shadow-lg">
      <div class="flex w-full gap-5">

        <!-- Texte -->
        <div class="flex flex-col flex-1 ml-4">
          <h2 class="text-[22px] font-semibold text-text">
            Remercîments
          </h2>
          <div class="flex flex-row gap-4">
            <p class="font-medium text-text-light" id="thanks">
            </p>
          </div>
        </div>

        <!-- Button : "Github" -->
        <div id="githubButton" class="flex items-end">
          <button class="transition-all duration-150 ease-in-out group/button cursor-pointer ml-[22px] px-2 py-1 bg-custom-gray-verydark hover:bg-custom-gray-dark active:bg-custom-pink flex-none rounded-lg focus:outline-none focus:ring-4 focus:ring-custom-gray-dark-transp border border-solid border-custom-gray-verydark-transp shadow-xl gap-[9px] flex items-center">
            <p class="transition-all duration-150 ease-in-out text-[18px] font-medium text-text-white group-active/button:text-text">
              Voir Github
            </p>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!--  █▀ █▀▀ ▀█▀ ▀█▀ █ █▄ █ █▀▀ -->
  <!--  ▄█ ██▄  █   █  █ █ ▀█ █▄█ -->

  <main id="setting" class="flex-1 hidden group-data-[tab=setting]/body:flex flex-col overflow-y-auto overflow-x-hidden flex-nowrap gap-6 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:bg-custom-gray-verylight [&::-webkit-scrollbar-thumb]:bg-custom-gray-light">

  </main>

</body>

</html>
